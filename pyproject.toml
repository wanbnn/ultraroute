[project]
name = "ultraroute"
version = "0.1.0"
description = "Local OpenAI-compatible gateway for personal web chat accounts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "playwright>=1.50", "pydantic>=2.10"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "pytest-asyncio>=0.25",
    "openai>=3.51.0",
]

[project.urls]
Repository = "https://github.com/wanbnn/ultraroute"
Issues = "https://github.com/wanbnn/ultraroute/issues"

[project.scripts]
ultraroute = "ultraroute.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultraroute"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
